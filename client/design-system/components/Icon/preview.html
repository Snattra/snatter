<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon</title>
<style>
  html, body { height: 100%; }
  #root { min-height: 100%; }

  .demo { display: flex; flex-wrap: wrap; gap: var(--space-8); padding: var(--space-16); background: var(--panel); min-height: 100vh; align-content: start; }
  .tile { display: grid; justify-items: center; gap: var(--space-4); width: 88px; padding: var(--space-8) 0; border-radius: var(--radius-sm); color: var(--muted); font-size: 12px; line-height: 16px; transition: background-color var(--duration-instant) var(--ease-standard), color var(--duration-instant) var(--ease-standard); }
  .tile:hover { background: var(--panel-raised); color: var(--text); }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Snatter, h = React.createElement, useState = React.useState;

  var names = ["hash", "speaker", "members", "chevron-left", "chevron-right", "plus", "close", "send", "arrow-right"];
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "demo" }, names.map(function (n) {
    return h("div", { key: n, className: "tile" }, h(S.Icon, { name: n }), n);
  })));

</script>
</body>
</html>
