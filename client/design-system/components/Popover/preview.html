<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popover</title>
<style>
  html, body { height: 100%; }
  #root { min-height: 100%; }

  .demo { display: flex; align-items: flex-end; justify-content: space-around; gap: var(--space-24); min-height: 100vh; padding: var(--space-24); background: var(--panel-raised); }
  .demo .sn-button { flex: none; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Snatter, h = React.createElement, useRef = React.useRef;

  // The popover's three states side by side: each button opens one; only one is open at a time.
  function Example(props) {
    var anchor = useRef(null);
    return h(React.Fragment, null,
      h("button", { ref: anchor, className: "sn-button sn-button-secondary", popovertarget: props.id }, props.label),
      h(S.Popover, { id: props.id, anchorRef: anchor, title: "Invite people to Pondside", description: "Anyone with this link can create an account and join." },
        props.children));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "demo" },
    h(Example, { id: "creating", label: "Creating" }, h(S.InviteLink)),
    h(Example, { id: "failed", label: "Failed" }, h(S.InviteLink, { error: "The server could not be reached.", onRetry: function () {} })),
    h(Example, { id: "ready", label: "Ready" }, h(S.InviteLink, { url: "https://chat.example.com/invite/k3Jd8QzP", expiry: "Expires in 7 days." }))));
  setTimeout(function () { var b = document.querySelector("[popovertarget=ready]"); if (b) b.click(); }, 50);

</script>
</body>
</html>
