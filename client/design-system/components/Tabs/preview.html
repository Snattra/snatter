<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<style>
  html, body { height: 100%; }
  #root { min-height: 100%; }

  .demo { min-height: 100vh; padding: var(--space-24); background: var(--panel); }
  .sn-tabs { max-width: 352px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Snatter, h = React.createElement, useState = React.useState;

  function Demo() {
    var tab = useState("log_in");
    return h("div", { className: "demo" },
      h(S.Tabs, { label: "Account", value: tab[0], onChange: tab[1], tabs: [{ id: "log_in", label: "Sign in" }, { id: "register", label: "Create account" }] }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));

</script>
</body>
</html>
