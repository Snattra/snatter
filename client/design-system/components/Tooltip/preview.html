<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tooltip</title>
<style>
  html, body { height: 100%; }
  #root { min-height: 100%; }

  .demo { display: flex; align-items: center; justify-content: center; gap: var(--space-24); min-height: 100vh; padding: var(--space-24); background: var(--panel-raised); }
  .demo .open > .sn-tooltip { opacity: 1; transform: none; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Snatter, h = React.createElement, useState = React.useState;

  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "demo" },
    h("span", { className: "open-wrap" }, h(S.Tooltip, { label: "Hide members", side: "bottom" }, h("button", { className: "sn-icon-button", "aria-label": "Hide members" }, h(S.Icon, { name: "members" })))),
    h(S.Tooltip, { label: "Collapse channels", side: "top" }, h("button", { className: "sn-icon-button", "aria-label": "Collapse channels" }, h(S.Icon, { name: "chevron-left" }))),
    h(S.Tooltip, { label: "Pondside", side: "right" }, h("button", { className: "sn-icon-button", "aria-label": "Pondside" }, h(S.Icon, { name: "hash" })))));
  // keep the first one open so the resting look shows
  setTimeout(function () { var a = document.querySelector(".open-wrap .sn-tooltip-anchor"); if (a) a.classList.add("open"); }, 50);

</script>
</body>
</html>
