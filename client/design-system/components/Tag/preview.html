<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tag</title>
<style>
  html, body { height: 100%; }
  #root { min-height: 100%; }

  .demo { display: grid; gap: var(--space-16); min-height: 100vh; padding: var(--space-24); background: var(--panel); align-content: start; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Snatter, h = React.createElement;

  var roles = [
    { name: "Admin", color: "#f0a35b" },
    { name: "Moderator", color: "#5ed4c4" },
    { name: "Raid leads", color: null },
    { name: "User", color: null }
  ];

  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "demo" },
    h("ul", { className: "sn-tags" }, roles.map(function (r) {
      return h("li", { key: r.name }, h(S.Tag, { color: r.color }, r.name));
    })),
    h("div", null, h(S.Tag, { accent: true }, "Owner"))));

</script>
</body>
</html>
