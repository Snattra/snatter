<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner</title>
<style>
  html, body { height: 100%; }
  #root { min-height: 100%; }

  .demo { display: grid; gap: var(--space-12); padding: var(--space-16); background: var(--panel-raised); min-height: 100vh; align-content: start; }
  .frame { overflow: hidden; border-radius: var(--radius-md); background: var(--panel-raised); box-shadow: 0 0 0 1px var(--divider); }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Snatter, h = React.createElement, useState = React.useState;

  function Demo() {
    var down = useState(true);
    return h("div", { className: "demo" },
      h("div", { className: "frame" }, down[0] && h(S.Banner, { busy: true }, "Reconnecting…")),
      h("div", { className: "frame" }, h(S.Banner, { tone: "danger" }, "You were signed out on another device.")),
      h("div", null, h(S.Button, { size: "sm", onClick: function () { down[1](false); setTimeout(function () { down[1](true); }, 300); } }, "Drop the connection again")));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));

</script>
</body>
</html>
