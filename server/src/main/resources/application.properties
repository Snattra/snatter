# How the Snatter server is built and wired. Nothing here is meant to be
# changed by whoever runs a server, and it is baked into the build:
# - Where the server runs (data directory, database file, port) is set with
#   environment variables, listed in server/README.md.
# - How the community runs (registration, sessions, rate limits, voice) is a
#   server setting the owner changes in the app, kept in the database.

quarkus.application.name=snatter-server
quarkus.http.port=8080

# Health checks live under /q/health (liveness: /q/health/live, readiness: /q/health/ready).
quarkus.smallrye-health.root-path=/q/health

# Log format: timestamp, level, logger, message.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] %s%e%n

# --- Database -----------------------------------------------------------------
# SQLite, in one file beside the uploaded content unless SNATTER_DB_PATH says
# otherwise. SqliteDriver applies the connection settings the server relies on
# and creates the directory.
#
# SQLite runs one write transaction at a time, so transactions share a single
# connection and wait for it in the pool, in order; reads outside transactions
# have their own read-only connections and run side by side. JdbiProducer
# picks the pool.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=app.snatter.server.persistence.SqliteDriver
quarkus.datasource.jdbc.url=jdbc:sqlite:${SNATTER_DB_PATH:${snatter.storage.root}/snatter.db}
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.acquisition-timeout=PT10S

quarkus.datasource.reader.db-kind=other
quarkus.datasource.reader.jdbc.driver=app.snatter.server.persistence.SqliteDriver
quarkus.datasource.reader.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.reader.jdbc.transactions=disabled
quarkus.datasource.reader.jdbc.new-connection-sql=PRAGMA query_only = true

# The SQLite driver loads its native library; the JVM wants that allowed.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# Flyway owns the schema; migrations live in src/main/resources/db/migration.
quarkus.flyway.migrate-at-start=true

# --- API documentation --------------------------------------------------------
# The hand-written contract protocol/openapi/openapi.yaml is served verbatim at
# /q/openapi; annotation scanning is off so code cannot diverge from it.
# Swagger UI is available at /q/swagger-ui in dev mode.
mp.openapi.scan.disable=true

# --- Gateway ------------------------------------------------------------------
# Ping idle connections so broken ones are noticed. Client frames are small.
quarkus.websockets-next.server.auto-ping-interval=PT30S
quarkus.websockets-next.server.max-message-size=16384

# --- Testing ------------------------------------------------------------------
%test.snatter.storage.root=target/test-data
# A fresh database every time the application starts, as the tests expect.
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-data/snatter-${quarkus.uuid}.db
# Connections get one second to identify, so the test for it is quick.
%test.snatter.gateway.identify-timeout=PT1S
