# Snatter server configuration.
# Every property here can be overridden with an environment variable, e.g.
# QUARKUS_HTTP_PORT=9000. See https://quarkus.io/guides/config-reference

quarkus.application.name=snatter-server
quarkus.http.port=8080

# Health checks live under /q/health (liveness: /q/health/live, readiness: /q/health/ready).
quarkus.smallrye-health.root-path=/q/health

# Log format: timestamp, level, logger, message.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] %s%e%n
