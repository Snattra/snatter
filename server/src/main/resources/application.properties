# How the Snatter server is built and wired. Nothing here is meant to be
# changed by whoever runs a server, and it is baked into the build:
# - Where the server runs (database, storage directory, port) is set with
#   environment variables, listed in server/README.md.
# - How the community runs (registration, sessions, rate limits, voice) is a
#   server setting the owner changes in the app, kept in the database.

quarkus.application.name=snatter-server
quarkus.http.port=8080

# Health checks live under /q/health (liveness: /q/health/live, readiness: /q/health/ready).
quarkus.smallrye-health.root-path=/q/health

# Log format: timestamp, level, logger, message.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] %s%e%n

# --- Database -----------------------------------------------------------------
# PostgreSQL is the only supported database.
# In dev and test modes no URL is configured, so Quarkus Dev Services starts a
# throwaway PostgreSQL container automatically (requires Docker or Podman).
quarkus.datasource.db-kind=postgresql

# Production connection, from the SNATTER_DB_* environment variables.
%prod.quarkus.datasource.jdbc.url=${SNATTER_DB_URL:jdbc:postgresql://localhost:5432/snatter}
%prod.quarkus.datasource.username=${SNATTER_DB_USER:snatter}
%prod.quarkus.datasource.password=${SNATTER_DB_PASSWORD}

# Flyway owns the schema; migrations live in src/main/resources/db/migration.
quarkus.flyway.migrate-at-start=true

# --- API documentation --------------------------------------------------------
# The hand-written contract protocol/openapi/openapi.yaml is served verbatim at
# /q/openapi; annotation scanning is off so code cannot diverge from it.
# Swagger UI is available at /q/swagger-ui in dev mode.
mp.openapi.scan.disable=true

# --- Gateway ------------------------------------------------------------------
# Ping idle connections so broken ones are noticed. Client frames are small.
quarkus.websockets-next.server.auto-ping-interval=PT30S
quarkus.websockets-next.server.max-message-size=16384

# --- Testing ------------------------------------------------------------------
# Integration tests launch the packaged application with the test profile so
# the %test settings apply to it as well.
%test.quarkus.test.integration-test-profile=test
%test.quarkus.test.native-image-profile=test
%test.snatter.storage.root=target/test-data
# Connections get one second to identify, so the test for it is quick.
%test.snatter.gateway.identify-timeout=PT1S
