# Runs a complete Snatter installation locally in the production profile:
# the server, and the web app in front of it.
#
#   docker compose up --build
#
# Everything the server keeps, its SQLite database and uploaded content, is in
# the server-data volume.
#
# Open http://localhost:8080. The web container serves the app and forwards
# /api, including the gateway, to the server, so all of that is on one port.
# Voice goes to the server directly, on UDP 8080, at SNATTER_MEDIA_ADDRESS
# (see below).

name: snatter

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: snatter-server:local
    restart: unless-stopped
    environment:
      # Take the client address from the web container's X-Forwarded-For, so
      # rate limits apply per client. Safe only because nothing but the web
      # container can reach the server.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      # The address browsers reach this machine at, such as its LAN or public
      # address. Unset, the server offers only its container's addresses,
      # which browsers on other machines cannot reach, nor can browsers on
      # this one under Docker Desktop.
      SNATTER_MEDIA_ADDRESS: ${SNATTER_MEDIA_ADDRESS:-}
    ports:
      # Voice, on the same number outside as inside, since the server offers
      # its own port number.
      - "8080:8080/udp"
    volumes:
      - server-data:/var/lib/snatter

  web:
    build:
      context: .
      dockerfile: client/web/Dockerfile
    image: snatter-web:local
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SNATTER_SERVER_URL: http://server:8080
    ports:
      - "${SNATTER_HTTP_PORT:-8080}:8080"

volumes:
  server-data:
