# Runs a complete Snatter installation locally in the production profile:
# PostgreSQL, the server, and the web app in front of it.
#
#   cp .env.example .env      # then set SNATTER_DB_PASSWORD
#   docker compose up --build
#
# Open http://localhost:8080. The web container serves the app and forwards
# /api, including the gateway, to the server, so everything is on that one
# port; the server itself is not published.

name: snatter

services:
  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: snatter
      POSTGRES_USER: snatter
      POSTGRES_PASSWORD: ${SNATTER_DB_PASSWORD:?Set SNATTER_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snatter -d snatter"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: snatter-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SNATTER_DB_URL: jdbc:postgresql://db:5432/snatter
      SNATTER_DB_USER: snatter
      SNATTER_DB_PASSWORD: ${SNATTER_DB_PASSWORD}
      # Take the client address from the web container's X-Forwarded-For, so
      # rate limits apply per client. Safe only because nothing but the web
      # container can reach the server.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
    volumes:
      - server-data:/var/lib/snatter

  web:
    build:
      context: .
      dockerfile: client/web/Dockerfile
    image: snatter-web:local
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SNATTER_SERVER_URL: http://server:8080
    ports:
      - "${SNATTER_HTTP_PORT:-8080}:8080"

volumes:
  db-data:
  server-data:
