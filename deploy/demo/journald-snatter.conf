# Keeps 30 days of logs, the containers' included, instead of what HostUp's
# 10-hostup-limits.conf keeps: 14 days, in at most 128 MB. Installed as
# /etc/systemd/journald.conf.d/20-snatter.conf, so it comes after theirs.

[Journal]
MaxRetentionSec=30day
# One file a day, so logs go when they turn 30 days old, not with a month's
# file.
MaxFileSec=1day
# The disk is 48 GB.
SystemMaxUse=2G
