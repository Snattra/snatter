openapi: 3.0.3
info:
  title: Snatter API
  version: "1"
  description: |
    HTTP API of a Snatter server.

    Authenticate with `POST /api/v1/auth/register` or `POST /api/v1/auth/login`
    and send the returned token on later calls as
    `Authorization: Bearer <token>`. Tokens are opaque; do not parse them.

    Every error response has the `ApiError` shape with a stable `error` code.
    The API is versioned in the path; within a version, changes are additive.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /

tags:
  - name: server
    description: What this server is
  - name: auth
    description: Registration, login and sessions
  - name: accounts
    description: Members of this community
  - name: blobs
    description: Binary content such as profile pictures
  - name: invites
    description: Invite links that let new people register
  - name: roles
    description: Roles bundle permissions and are assigned to members

paths:
  /api/v1/server-info:
    get:
      tags: [server]
      operationId: getServerInfo
      summary: Describe this server
      description: Public. Clients call this first to learn what they are talking to.
      responses:
        "200":
          description: Server description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /api/v1/server-settings:
    get:
      tags: [server]
      operationId: getServerSettings
      summary: Read the server settings
      description: Requires the `MANAGE_SERVER` permission.
      security:
        - session: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [server]
      operationId: updateServerSettings
      summary: Change server settings
      description: |
        Requires the `MANAGE_SERVER` permission. Fields that are absent stay
        unchanged. Send `description` as an empty string to clear it. Changes
        take effect immediately.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/challenge:
    get:
      tags: [auth]
      operationId: getChallenge
      summary: Obtain a proof-of-work challenge for registration
      description: |
        Returns an [ALTCHA](https://altcha.org) challenge. Find a `number` between
        0 and `maxnumber` such that `SHA-256(salt + number)` in hex equals
        `challenge`, then send `altcha` in the registration request as the
        base64-encoded JSON object `{algorithm, challenge, number, salt, signature}`.
        Each challenge expires after a few minutes and can be used once.
        Only needed when `ServerInfo.registration.challengeRequired` is true.
      responses:
        "200":
          description: A fresh challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a local account
      description: |
        Creates an account with a username and password and opens a session.
        Allowed when `ServerInfo.registration.mode` is `open`, or always for the
        very first account on a fresh server. When
        `ServerInfo.registration.challengeRequired` is true the request must
        carry a solved challenge in `altcha`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: |
            Request is invalid (`validation_failed`), the challenge is missing
            (`challenge_required`), or the challenge is wrong, expired or already
            used (`challenge_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: |
            Registration needs an invite and none was given
            (`registration_closed`), or the invite is unknown, revoked, expired
            or used up (`invite_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username already in use (`username_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown username or wrong password (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the calling session
      security:
        - session: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/accounts/me:
    get:
      tags: [accounts]
      operationId: getCurrentAccount
      summary: The calling account
      security:
        - session: []
      responses:
        "200":
          description: The account that owns the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: A member's profile
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/me/avatar:
    put:
      tags: [accounts]
      operationId: setAvatar
      summary: Replace the calling account's profile picture
      description: |
        The body is the raw image. PNG, JPEG, GIF and WebP are accepted, at most
        1 MiB and between 32 and 1024 pixels on each side. The format is detected
        from the bytes; the declared Content-Type is ignored. The server stores
        the image as uploaded, so crop and scale before uploading.
      security:
        - session: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              $ref: "#/components/schemas/Binary"
          image/jpeg:
            schema:
              $ref: "#/components/schemas/Binary"
          image/gif:
            schema:
              $ref: "#/components/schemas/Binary"
          image/webp:
            schema:
              $ref: "#/components/schemas/Binary"
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/Binary"
      responses:
        "200":
          description: Updated account, with the new `avatarId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Not a supported image (`unsupported_image`) or wrong size (`image_dimensions`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Image larger than 1 MiB (`image_too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [accounts]
      operationId: clearAvatar
      summary: Remove the calling account's profile picture
      security:
        - session: []
      responses:
        "200":
          description: Updated account, with `avatarId` null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/invites:
    get:
      tags: [invites]
      operationId: listInvites
      summary: List invites
      description: Members with `MANAGE_INVITES` see every invite; others see the ones they created.
      security:
        - session: []
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [invites]
      operationId: createInvite
      summary: Create an invite
      description: |
        Requires the `CREATE_INVITE` permission, which the default role grants
        unless the server changed it. Omitted limits mean the invite never
        expires or has unlimited uses.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The new invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/invites/{code}:
    get:
      tags: [invites]
      operationId: previewInvite
      summary: Look at an invite before registering
      description: |
        Public. Tells a prospective member which community the invite is for
        and who sent it. Unknown or revoked codes answer 404; expired or used-up
        codes answer 410.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/InviteCode"
      responses:
        "200":
          description: What the invite leads to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: No such invite (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: The invite has expired or has no uses left (`invite_unusable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke an invite
      description: Allowed for the invite's creator and for members with `MANAGE_INVITES`.
      security:
        - session: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/InviteCode"
      responses:
        "204":
          description: Revoked; the code can no longer be used
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invite (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles
      description: Every member may see the roles, ordered from highest position to lowest.
      security:
        - session: []
      responses:
        "200":
          description: Roles, highest first; the default role is last
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role
      description: |
        Requires `MANAGE_ROLES`. The new role is placed at the bottom, just
        above the default role. A caller may only grant permissions they hold
        themselves (`permission_escalation`).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: The new role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/roles/{id}:
    patch:
      tags: [roles]
      operationId: updateRole
      summary: Change a role
      description: |
        Requires `MANAGE_ROLES`. Only roles below the caller's highest role can
        be changed (`role_hierarchy`), and only permissions the caller holds
        can be granted (`permission_escalation`). The default role accepts
        permission changes only (`default_role`). Absent fields stay unchanged.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: The updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [roles]
      operationId: deleteRole
      summary: Delete a role
      description: |
        Requires `MANAGE_ROLES` and a role below the caller's highest
        (`role_hierarchy`). The default role cannot be deleted (`default_role`).
        Members holding the role simply lose it.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/{id}/roles/{roleId}:
    put:
      tags: [roles]
      operationId: assignRole
      summary: Give a member a role
      description: |
        Requires `MANAGE_ROLES` and a role below the caller's highest
        (`role_hierarchy`). Idempotent. The default role is implicit and cannot
        be assigned (`default_role`).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: roleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      responses:
        "204":
          description: The member has the role
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [roles]
      operationId: unassignRole
      summary: Take a role from a member
      description: Same rules as assigning. Idempotent.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: roleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      responses:
        "204":
          description: The member no longer has the role
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/me/permissions:
    get:
      tags: [roles]
      operationId: getMyPermissions
      summary: The caller's effective permissions
      description: |
        The union of the caller's roles and the default role, or every
        permission for the server owner. Clients use this to show or hide
        controls.
      security:
        - session: []
      responses:
        "200":
          description: Effective permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionSet"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/blobs/{id}:
    get:
      tags: [blobs]
      operationId: getBlob
      summary: Fetch binary content
      description: |
        Public. Blobs are immutable and their ids unguessable, so responses may be
        cached indefinitely. `Account.avatarId` values are fetched here.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BlobId"
      responses:
        "200":
          description: |
            The content. The actual `Content-Type` header is the type recorded
            when the blob was uploaded, for example `image/png`; it is declared
            here as `application/octet-stream` because this operation must
            advertise exactly one media type.
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`public, max-age=31536000, immutable`"
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "404":
          # No content block on purpose: this operation must advertise a single
          # media type. The body is still an `ApiError` JSON document with
          # code `blob_not_found`.
          description: No such blob (`blob_not_found`)

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Opaque session token from `/api/v1/auth/login` or `/register`

  responses:
    BadRequest:
      description: Request is invalid (`validation_failed`, with per-field messages)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, invalid or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: |
        The caller is signed in but not allowed to do this: missing permission
        (`forbidden`), role at or above their own (`role_hierarchy`), or
        granting a permission they lack (`permission_escalation`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: |
        Too many requests from this client (`rate_limited`). The `Retry-After`
        header says how many seconds to wait.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    AccountId:
      type: string
      format: uuid
      description: Identifies an account on this server

    BlobId:
      type: string
      format: uuid
      description: Identifies a blob on this server

    RoleId:
      type: string
      format: uuid
      description: Identifies a role on this server

    Permission:
      type: string
      description: |
        Server-level permissions. Channel-level overrides will refine the
        channel-oriented ones later.
      enum:
        - MANAGE_SERVER
        - MANAGE_ROLES
        - MANAGE_CHANNELS
        - MANAGE_INVITES
        - KICK_MEMBERS
        - BAN_MEMBERS
        - CREATE_INVITE
        - VIEW_CHANNELS
        - SEND_MESSAGES
        - MANAGE_MESSAGES
        - CONNECT
        - SPEAK
        - STREAM
        - MUTE_MEMBERS
        - MOVE_MEMBERS

    PermissionSet:
      type: object
      required: [owner, permissions]
      properties:
        owner:
          type: boolean
          description: True for the server owner, who holds every permission
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    Role:
      type: object
      required: [id, name, position, permissions, isDefault, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/RoleId"
        name:
          type: string
          example: Moderator
        color:
          type: string
          nullable: true
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#5865F2"
        position:
          type: integer
          description: Higher means more senior; the default role is 0
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        isDefault:
          type: boolean
          description: The role every member has implicitly
        createdAt:
          type: string
          format: date-time

    RoleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: Defaults to none

    RoleUpdate:
      type: object
      description: Partial update; absent fields stay unchanged
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^$|^#[0-9A-Fa-f]{6}$"
          description: Empty string clears the colour
        position:
          type: integer
          minimum: 1
          description: Roles at or above this position move up one
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: Replaces the whole set

    InviteCode:
      type: string
      pattern: "^[A-Za-z0-9]{8}$"
      description: Identifies an invite; the last path segment of an invite link
      example: k3Jd8QzP

    Binary:
      type: string
      format: binary

    InviteCreate:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 31536000
          description: Lifetime from now; omit for an invite that never expires
        maxUses:
          type: integer
          minimum: 1
          maximum: 1000000
          description: How many registrations may use it; omit for unlimited

    Invite:
      type: object
      required: [code, url, createdBy, createdAt, uses, revoked]
      properties:
        code:
          $ref: "#/components/schemas/InviteCode"
        url:
          type: string
          description: Full link, built from `ServerSettings.publicUrl` when set
          example: https://chat.example.com/invite/k3Jd8QzP
        createdBy:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: Null if the creator's account was deleted
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        uses:
          type: integer
        revoked:
          type: boolean

    InvitePreview:
      type: object
      required: [code, community]
      properties:
        code:
          $ref: "#/components/schemas/InviteCode"
        community:
          $ref: "#/components/schemas/Community"
        inviter:
          allOf:
            - $ref: "#/components/schemas/Account"
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ServerInfo:
      type: object
      required: [name, version, apiVersion, community, registration]
      properties:
        registration:
          $ref: "#/components/schemas/RegistrationInfo"
        name:
          type: string
          description: Software name, always `Snatter`
          example: Snatter
        version:
          type: string
          description: Software version
          example: 0.1.0
        apiVersion:
          type: integer
          description: API compatibility version; bumped on incompatible changes
          example: 1
        community:
          $ref: "#/components/schemas/Community"

    RegistrationMode:
      type: string
      enum: [open, invite_only]
      description: |
        `open`: anyone may register. `invite_only`: registration needs an
        invite (the first account on a fresh server is always allowed).

    RegistrationInfo:
      type: object
      required: [mode, challengeRequired]
      properties:
        mode:
          $ref: "#/components/schemas/RegistrationMode"
        challengeRequired:
          type: boolean
          description: Whether registration requires a solved challenge from `GET /api/v1/auth/challenge`

    RateLimitPolicy:
      type: object
      required: [limit, periodSeconds]
      description: A token bucket per client IP allowing `limit` requests per `periodSeconds`
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100000
        periodSeconds:
          type: integer
          minimum: 1
          maximum: 86400

    RateLimits:
      type: object
      required: [enabled, login, register, challenge, invite]
      properties:
        enabled:
          type: boolean
        login:
          $ref: "#/components/schemas/RateLimitPolicy"
        register:
          $ref: "#/components/schemas/RateLimitPolicy"
        challenge:
          $ref: "#/components/schemas/RateLimitPolicy"
        invite:
          allOf:
            - $ref: "#/components/schemas/RateLimitPolicy"
          description: Applies to the public invite preview

    ServerSettings:
      type: object
      required: [name, registrationMode, challengeRequired, rateLimits]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        publicUrl:
          type: string
          nullable: true
          maxLength: 255
          description: Address clients reach this server at, used to build invite links
          example: https://chat.example.com
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        challengeRequired:
          type: boolean
          description: Require a proof-of-work challenge on registration
        rateLimits:
          $ref: "#/components/schemas/RateLimits"

    ServerSettingsUpdate:
      type: object
      description: Partial update; absent fields stay unchanged
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          description: Empty string clears the description
        publicUrl:
          type: string
          maxLength: 255
          pattern: "^$|^https?://[^/\\s]+(/[^\\s]*)?$"
          description: Empty string clears it; otherwise an http(s) URL, trailing slash ignored
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        challengeRequired:
          type: boolean
        rateLimits:
          $ref: "#/components/schemas/RateLimits"

    Challenge:
      type: object
      required: [algorithm, challenge, salt, signature, maxnumber]
      properties:
        algorithm:
          type: string
          enum: [SHA-256]
        challenge:
          type: string
          description: Hex SHA-256 of `salt + number`
        salt:
          type: string
          description: Random salt; contains `?expires=<unix seconds>`
        signature:
          type: string
          description: Server HMAC over `challenge`; opaque to clients
        maxnumber:
          type: integer
          description: Upper bound for `number`

    Community:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Snattra HQ
        description:
          type: string
          nullable: true
          maxLength: 1000

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.]+$"
          description: Unique on this server regardless of case
          example: robin
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          maxLength: 64
          description: Defaults to the username
        altcha:
          type: string
          maxLength: 2048
          description: Solved challenge payload; required when `ServerInfo.registration.challengeRequired` is true
        inviteCode:
          allOf:
            - $ref: "#/components/schemas/InviteCode"
          description: Required when `ServerInfo.registration.mode` is `invite_only`; validated if given otherwise

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: robin
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [token, expiresAt, account]
      properties:
        token:
          type: string
          description: Bearer token for later requests
          example: snt_Zm9vYmFyYmF6cXV4...
        expiresAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"

    Account:
      type: object
      required: [id, username, displayName, roleIds, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        username:
          type: string
          example: robin
        displayName:
          type: string
          example: Robin
        avatarId:
          allOf:
            - $ref: "#/components/schemas/BlobId"
          nullable: true
          description: Profile picture, fetch at `/api/v1/blobs/{avatarId}`; null if none
        roleIds:
          type: array
          items:
            $ref: "#/components/schemas/RoleId"
          description: Assigned roles; the default role is implicit and not listed
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code
          example: username_taken
        message:
          type: string
          description: Human-readable explanation
        fields:
          type: object
          additionalProperties:
            type: string
          description: Per-field messages, present for `validation_failed` only
