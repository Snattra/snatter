openapi: 3.0.3
info:
  title: Snatter API
  version: "1.0"
  description: |
    HTTP API and WebSocket gateway of a Snatter server.

    Authenticate with `POST /api/v1/auth/register` or `POST /api/v1/auth/login`
    and send the returned token on later calls as
    `Authorization: Bearer <token>`. Tokens are opaque; do not parse them.
    A session ends when it goes unused for as long as the server allows
    (`ServerSettings.sessionLifetimeDays`, 30 days unless changed), when it
    is logged out, or when the server revokes it; any authenticated call
    extends it.

    Every error response has the `ApiError` shape with a stable `error` code.

    ## Versions

    The protocol has a version `major.minor`, the `info.version` of this
    document. A minor version only adds: operations, optional fields, frame
    types, enum values, close codes. A major version breaks something.
    Clients must ignore fields and frame types they do not know and make the
    best of enum values they do not know, and the server ignores client
    frames of a type it does not know, so either side can be a minor version
    ahead of the other.

    `GET /api/v1/server-info` states the server's version and the oldest
    client version it accepts, in `protocol`. It keeps that path and that
    field in every version, so any client can find out whether it can talk
    to any server, before signing in. Clients send their own version in
    `identify`; the server closes the connection with `client_outdated`
    when it is older than it accepts. The server accepts every client of its
    own major version unless a release raises the minimum. It is up to
    the client which server versions it works with.

    ## Gateway

    Live updates arrive over a WebSocket at `/api/v1/gateway`. Frames are
    JSON text messages, described by the `Gateway*` schemas below:
    `GatewayClientFrame` from client to server, `GatewayServerFrame` from
    server to client, each told apart by `type`.

    1. Connect and send `identify` with a session token within 10 seconds.
    2. The server answers with `ready`: the caller's account, permissions,
       the server, its roles, members, who is online, the channels the
       caller can see and how far they have read each one.
    3. From then on the server pushes events. Each carries `seq`, counting
       up from 1 (`ready`) per connection, so gaps are detectable. The
       client may send `typing` frames.

    The connection carries state, not history: on reconnecting, a client
    gets a fresh `ready` and fetches messages it missed with
    `GET .../messages?after=<last id>`. Events are sent only after the change
    is stored. Clients should treat a `message_created` for a message they
    already have as an update, since one can overlap a page fetched at the
    same time.

    The server closes the connection with a code from `GatewayCloseReason`
    and its name as the reason text. It sends WebSocket pings; clients need
    no heartbeat of their own.

    Clients ignore frames of a type they do not know, which a newer server
    may send; their `seq` still counts.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /

tags:
  - name: server
    description: What this server is
  - name: auth
    description: Registration, login and sessions
  - name: accounts
    description: Members of this community
  - name: blobs
    description: Binary content such as profile pictures
  - name: invites
    description: Invite links that let new people register
  - name: moderation
    description: Bans and timeouts
  - name: roles
    description: Roles bundle permissions and are assigned to members
  - name: channels
    description: Text and voice channels, public or private to some roles
  - name: messages
    description: Messages and system notices in text channels

paths:
  /api/v1/server-info:
    get:
      tags: [server]
      operationId: getServerInfo
      summary: Describe this server
      description: Public. Clients call this first to learn what they are talking to.
      security: []
      responses:
        "200":
          description: Server description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /api/v1/server-settings:
    get:
      tags: [server]
      operationId: getServerSettings
      summary: Read the server settings
      description: Requires the `MANAGE_SERVER` permission.
      security:
        - session: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [server]
      operationId: updateServerSettings
      summary: Change server settings
      description: |
        Requires the `MANAGE_SERVER` permission. Fields that are absent stay
        unchanged. Send `description` as an empty string to clear it. Changes
        take effect immediately.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/challenge:
    get:
      tags: [auth]
      operationId: getChallenge
      summary: Obtain a proof-of-work challenge for registration
      description: |
        Returns an [ALTCHA](https://altcha.org) challenge. Find a `number` between
        0 and `maxnumber` such that `SHA-256(salt + number)` in hex equals
        `challenge`, then send `altcha` in the registration request as the
        base64-encoded JSON object `{algorithm, challenge, number, salt, signature}`.
        Each challenge expires after a few minutes and can be used once.
        Only needed when `ServerInfo.registration.challengeRequired` is true.
      security: []
      responses:
        "200":
          description: A fresh challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a local account
      description: |
        Creates an account with a username and password and opens a session.
        Allowed when `ServerInfo.registration.mode` is `open`, or always for the
        very first account on a fresh server. When
        `ServerInfo.registration.challengeRequired` is true the request must
        carry a solved challenge in `altcha`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: |
            Request is invalid (`validation_failed`), the display name breaks
            its rules (`invalid_display_name`), the challenge is missing
            (`challenge_required`), or the challenge is wrong, expired or already
            used (`challenge_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: |
            Registration needs an invite and none was given
            (`registration_closed`), or the invite is unknown, revoked, expired
            or used up (`invite_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username already in use (`username_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown username or wrong password (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: |
            The account is banned (`banned`); `ApiError.ban` says why. Only
            answered to the right password, so it reveals nothing to guessers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the calling session
      security:
        - session: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/accounts/me:
    get:
      tags: [accounts]
      operationId: getCurrentAccount
      summary: The calling account
      security:
        - session: []
      responses:
        "200":
          description: The account that owns the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/accounts/{id}/messages:
    delete:
      tags: [messages]
      operationId: purgeMessages
      summary: Delete a member's recent messages
      description: |
        Requires `MANAGE_MESSAGES`. Deletes every message the member sent
        since `since`, in the channels the caller can see, as
        `deleteMessage` would; notices and messages already deleted are left
        alone. Each channel concerned gets one `messages_purged` frame.
        `since` must not be in the future (`invalid_since`).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: How many messages were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePurgeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: A member's profile
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/me/avatar:
    put:
      tags: [accounts]
      operationId: setAvatar
      summary: Replace the calling account's profile picture
      description: |
        The body is the raw image. PNG, JPEG, GIF and WebP are accepted, at most
        1 MiB and between 32 and 1024 pixels on each side. The format is detected
        from the bytes; the declared Content-Type is ignored. The server stores
        the image as uploaded, so crop and scale before uploading.
      security:
        - session: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              $ref: "#/components/schemas/Binary"
          image/jpeg:
            schema:
              $ref: "#/components/schemas/Binary"
          image/gif:
            schema:
              $ref: "#/components/schemas/Binary"
          image/webp:
            schema:
              $ref: "#/components/schemas/Binary"
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/Binary"
      responses:
        "200":
          description: Updated account, with the new `avatarId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Not a supported image (`unsupported_image`) or wrong size (`image_dimensions`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Image larger than 1 MiB (`image_too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [accounts]
      operationId: clearAvatar
      summary: Remove the calling account's profile picture
      security:
        - session: []
      responses:
        "200":
          description: Updated account, with `avatarId` null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/bans:
    get:
      tags: [moderation]
      operationId: listBans
      summary: List bans
      description: Requires `BAN_MEMBERS`. Newest first.
      security:
        - session: []
      responses:
        "200":
          description: Every ban
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ban"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/bans/{accountId}:
    put:
      tags: [moderation]
      operationId: banMember
      summary: Ban a member
      description: |
        Requires `BAN_MEMBERS`. Ends every session of the member at once,
        closing their gateway connections with `banned`, and refuses them
        from then on; logging in answers `banned` with the reason. The caller
        must hold every permission the member has (`member_outranks_you`);
        the owner cannot be banned (`member_outranks_you`), and nobody can
        ban themselves (`cannot_moderate_self`). Banning a banned member replaces
        the reason. The member's messages stay, and they stay a member:
        everyone is sent `member_updated` with `bannedAt` set, while the
        reason is only for `BAN_MEMBERS` (`listBans`).
      security:
        - session: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanCreate"
      responses:
        "200":
          description: The ban
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ban"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [moderation]
      operationId: unbanMember
      summary: Lift a ban
      description: |
        Requires `BAN_MEMBERS`. Idempotent. The member can log in again, and
        everyone is sent `member_updated` with `bannedAt` cleared.
      security:
        - session: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
      responses:
        "204":
          description: The member is not banned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/timeouts/{accountId}:
    put:
      tags: [moderation]
      operationId: timeOutMember
      summary: Time a member out
      description: |
        Requires `TIMEOUT_MEMBERS`. For the given time the member keeps their
        roles, sessions and view of channels but holds no permissions: they
        can read but not post, invite or speak. A running timeout is
        replaced. The rules of banning apply (`member_outranks_you`,
        `cannot_moderate_self`). Everyone sees it as `Account.timedOutUntil`
        through `member_updated`; the member also gets `permissions_changed`,
        again when it ends.
      security:
        - session: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeoutCreate"
      responses:
        "200":
          description: The member, with their timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [moderation]
      operationId: endTimeout
      summary: End a member's timeout early
      description: Same rules as starting one. Idempotent.
      security:
        - session: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
      responses:
        "204":
          description: The member is not timed out
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invites:
    get:
      tags: [invites]
      operationId: listInvites
      summary: List invites
      description: Members with `MANAGE_INVITES` see every invite; others see the ones they created.
      security:
        - session: []
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [invites]
      operationId: createInvite
      summary: Create an invite
      description: |
        Requires the `CREATE_INVITE` permission, which the standard User role
        grants unless the server changed it. Omitted limits mean the invite never
        expires or has unlimited uses.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The new invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/invites/{code}:
    get:
      tags: [invites]
      operationId: previewInvite
      summary: Look at an invite before registering
      description: |
        Public. Tells a prospective member which community the invite is for
        and who sent it. Unknown or revoked codes answer 404; expired or used-up
        codes answer 410.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/InviteCode"
      responses:
        "200":
          description: What the invite leads to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: No such invite (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: The invite has expired or has no uses left (`invite_unusable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke an invite
      description: Allowed for the invite's creator and for members with `MANAGE_INVITES`.
      security:
        - session: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/InviteCode"
      responses:
        "204":
          description: Revoked; the code can no longer be used
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invite (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles
      description: Every member may see the roles, ordered from highest position to lowest.
      security:
        - session: []
      responses:
        "200":
          description: Roles, highest position first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role
      description: |
        Requires `MANAGE_ROLES`. The new role is placed at the bottom, at
        position 0. A caller may only grant permissions they hold
        themselves (`permission_escalation`).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: The new role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/roles/{id}:
    patch:
      tags: [roles]
      operationId: updateRole
      summary: Change a role
      description: |
        Requires `MANAGE_ROLES`, and the caller must hold every permission of
        the role, both before and after the change (`permission_escalation`).
        Absent fields stay unchanged.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: The updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [roles]
      operationId: deleteRole
      summary: Delete a role
      description: |
        Requires `MANAGE_ROLES` and every permission of the role
        (`permission_escalation`). Members holding the role simply lose it.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The role is in use (`role_in_use`): new members get it, or channels
            require it. Change that first, so that no private channel turns
            public by accident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/accounts/{id}/roles/{roleId}:
    put:
      tags: [roles]
      operationId: assignRole
      summary: Give a member a role
      description: |
        Requires `MANAGE_ROLES` and every permission of the role
        (`permission_escalation`). Idempotent.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: roleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      responses:
        "204":
          description: The member has the role
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [roles]
      operationId: unassignRole
      summary: Take a role from a member
      description: Same rules as assigning. Idempotent.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: roleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoleId"
      responses:
        "204":
          description: The member no longer has the role
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/me/permissions:
    get:
      tags: [roles]
      operationId: getMyPermissions
      summary: The caller's effective permissions
      description: |
        The union of the caller's roles, or every permission for the server
        owner. Without roles the caller can only browse. Permissions apply in
        every channel the caller can see. Clients use this to show or hide
        controls.
      security:
        - session: []
      responses:
        "200":
          description: Effective permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionSet"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: List channels
      description: |
        The channels the caller can see, ordered by position: public ones and
        those they hold a required role for. The owner sees every channel.
      security:
        - session: []
      responses:
        "200":
          description: Visible channels, top first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [channels]
      operationId: createChannel
      summary: Create a channel
      description: |
        Requires `MANAGE_CHANNELS`. The channel is placed last. Voice
        channels start at the server's default bitrate unless one is given.
        `bitrate` and `userLimit` are rejected for text channels
        (`not_a_voice_channel`). A bitrate may be anything Opus supports,
        8000 to 510000 bits per second.

        `requiredRoleIds` are stored in the same transaction, so a private
        channel is never visible to anyone else, not even briefly. They must
        name existing roles
        (`invalid_required_role`), and unless the caller is the owner they
        must include a role the caller holds (`required_role_not_held`).

        Channel names are unique regardless of case, across all channels,
        including ones the caller cannot see (`channel_name_taken`).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: The new channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another channel already has this name, in any case (`channel_name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/channels/{id}:
    get:
      tags: [channels]
      operationId: getChannel
      summary: Fetch a channel
      description: Channels the caller cannot see answer `channel_not_found`.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [channels]
      operationId: updateChannel
      summary: Change a channel
      description: |
        Requires `MANAGE_CHANNELS` and a channel the caller can see. Absent
        fields stay unchanged; the type cannot be changed. Moving a channel
        shifts the channels between its old and new place by one. The name,
        voice settings and required roles follow the rules of creation.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: The updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another channel already has this name, in any case (`channel_name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [channels]
      operationId: deleteChannel
      summary: Delete a channel
      description: Requires `MANAGE_CHANNELS` and a channel the caller can see.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{id}/messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: Read a channel's messages
      description: |
        A page of messages in chronological order, oldest first. Without a
        cursor it is the latest `limit` messages; with `before` the `limit`
        messages just before that one, for scrolling back; with `after` the
        `limit` messages just after it, for catching up. `before` and `after`
        cannot be combined (`invalid_paging`). The cursor message need not
        exist any more. Voice-only channels have no messages
        (`voice_only_channel`).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
        - name: before
          in: query
          schema:
            $ref: "#/components/schemas/MessageId"
        - name: after
          in: query
          schema:
            $ref: "#/components/schemas/MessageId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [messages]
      operationId: createMessage
      summary: Send a message
      description: |
        Requires `SEND_MESSAGES` in the channel. A reply must refer to a
        user message in the same channel (`invalid_reply`). Voice-only
        channels have no messages (`voice_only_channel`). A message
        mentions at most 20 members (`too_many_mentions`). How many
        messages a member may send is the `message` rate limit, counted
        per account across all channels (`rate_limited`).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: The message, with the request's `nonce`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/channels/{id}/messages/{messageId}:
    get:
      tags: [messages]
      operationId: getMessage
      summary: Fetch one message
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
        - name: messageId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MessageId"
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit a message
      description: |
        Only the author may edit, and only user messages (`forbidden`). The
        previous text is not kept; `editedAt` records that it changed.
        The mentions are worked out again from the new text, with the same
        limit as sending (`too_many_mentions`).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
        - name: messageId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: The edited message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        The author may delete their own user messages; `MANAGE_MESSAGES` in
        the channel allows deleting any message, system notices included.

        A user message becomes a `DeletedMessage` in its place, announced as
        `message_updated`: its content, mentions and reply are removed for
        good, and `removedByModerator` says whether someone other than the
        author deleted it. A system notice is removed entirely, announced as
        `message_deleted`. Deleting a message that is already deleted
        changes nothing. Replies keep `replyToId` but get a null `replyTo`.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
        - name: messageId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MessageId"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{id}/read-state:
    put:
      tags: [messages]
      operationId: markRead
      summary: Mark a channel read up to a message
      description: |
        Moves the caller's read marker in the channel forward to a message
        in it (`message_not_found` otherwise). The marker never moves back:
        an older message leaves it where it is. The caller's gateway
        connections get `read_state_updated` when it moves. Sending a
        message moves the sender's marker to it. Voice-only channels have no
        messages (`voice_only_channel`).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadStateUpdate"
      responses:
        "200":
          description: The read state after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/blobs/{id}:
    get:
      tags: [blobs]
      operationId: getBlob
      summary: Fetch binary content
      description: |
        Public. Blobs are immutable and their ids unguessable, so responses may be
        cached indefinitely. `Account.avatarId` values are fetched here.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BlobId"
      responses:
        "200":
          description: |
            The content. The actual `Content-Type` header is the type recorded
            when the blob was uploaded, for example `image/png`; it is declared
            here as `application/octet-stream` because this operation must
            advertise exactly one media type.
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`public, max-age=31536000, immutable`"
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "404":
          # No content block on purpose: this operation must advertise a single
          # media type. The body is still an `ApiError` JSON document with
          # code `blob_not_found`.
          description: No such blob (`blob_not_found`)

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Opaque session token from `/api/v1/auth/login` or `/register`

  responses:
    BadRequest:
      description: Request is invalid (`validation_failed`, with per-field messages)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, invalid or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: |
        The caller is signed in but not allowed to do this: missing permission
        (`forbidden`), managing a role or granting a permission they lack
        (`permission_escalation`), or moderating a member whose permissions
        they do not all hold (`member_outranks_you`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: |
        Too many requests from this client (`rate_limited`). The `Retry-After`
        header says how many seconds to wait.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    AccountId:
      type: string
      format: uuid
      description: Identifies an account on this server

    BlobId:
      type: string
      format: uuid
      description: Identifies a blob on this server

    RoleId:
      type: string
      format: uuid
      description: Identifies a role on this server

    ChannelId:
      type: string
      format: uuid
      description: Identifies a channel on this server

    MessageId:
      type: string
      format: uuid
      description: |
        Identifies a message. Ids increase with time, so they order messages
        and serve as paging cursors.

    MessageReference:
      type: object
      required: [id]
      description: The message replied to, enough to show a preview
      properties:
        id:
          $ref: "#/components/schemas/MessageId"
        authorId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
        content:
          type: string

    Message:
      description: |
        A message in a channel, told apart by `kind`: `user` for a member's
        message, `system` for a notice the server wrote about something that
        happened, `deleted` for what is left of a deleted member's message.
      oneOf:
        - $ref: "#/components/schemas/UserMessage"
        - $ref: "#/components/schemas/SystemMessage"
        - $ref: "#/components/schemas/DeletedMessage"
      discriminator:
        propertyName: kind
        mapping:
          user: "#/components/schemas/UserMessage"
          system: "#/components/schemas/SystemMessage"
          deleted: "#/components/schemas/DeletedMessage"

    MessageBase:
      type: object
      description: What every kind of message has
      required: [kind, id, channelId, createdAt]
      properties:
        kind:
          type: string
          description: "`user`, `system` or `deleted`"
        id:
          $ref: "#/components/schemas/MessageId"
        channelId:
          $ref: "#/components/schemas/ChannelId"
        authorId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: |
            The writer, or for a notice the member who caused it. Null once
            that account is deleted.
        createdAt:
          type: string
          format: date-time

    UserMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [content, mentions]
          properties:
            content:
              type: string
              description: |
                Plain text with chat Markdown, rendered by clients:
                `**bold**`, `*italic*` or `_italic_`, `__underline__`,
                `~~strikethrough~~`, `||spoiler||`, `` `code` ``, fenced code
                blocks, `> ` quotes, lists (`-`, `*` or `1.`, nested by
                indentation) and bare http(s) addresses, which clients show in
                full. There is no HTML, no image, no heading and no link with
                its own text; everything else shows as typed, line breaks
                included. Mentions are tokens in the text: `<@accountId>` for a member,
                `<@&roleId>` for a role and `<#channelId>` for a channel.
            mentions:
              type: array
              items:
                $ref: "#/components/schemas/AccountId"
              maxItems: 20
              description: |
                The members the content mentions, worked out by the server
                from its `<@accountId>` tokens: each once, in order of first
                mention, and only accounts that existed when the message was
                sent or last edited.
            replyToId:
              allOf:
                - $ref: "#/components/schemas/MessageId"
              nullable: true
              description: The message this replies to, kept after that message is deleted
            replyTo:
              allOf:
                - $ref: "#/components/schemas/MessageReference"
              nullable: true
              description: Preview of the message replied to; null if there is none or it was deleted
            nonce:
              type: string
              nullable: true
              description: |
                The sender's `nonce`, only in the response to sending it and on
                the gateway connections of the session that sent it
            editedAt:
              type: string
              format: date-time
              nullable: true

    SystemMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [notice]
          properties:
            notice:
              $ref: "#/components/schemas/SystemNotice"

    DeletedMessage:
      description: |
        A member's message that was deleted. It keeps its place in the
        channel, but its content, mentions and reply are gone for good.
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [deletedAt, removedByModerator]
          properties:
            deletedAt:
              type: string
              format: date-time
            removedByModerator:
              type: boolean
              description: Deleted by someone other than its author, using `MANAGE_MESSAGES`

    MessagePurgeResult:
      type: object
      required: [removed]
      properties:
        removed:
          type: integer
          minimum: 0
          description: How many messages were deleted

    SystemNotice:
      description: |
        What a system message is about, told apart by `type`. Channel notices
        appear in the channel concerned, the others in the server's system
        channel. Clients render the text themselves so it can be translated,
        and should show types they do not know generically, as new ones will
        be added.
      oneOf:
        - $ref: "#/components/schemas/ChannelCreatedNotice"
        - $ref: "#/components/schemas/ChannelRenamedNotice"
        - $ref: "#/components/schemas/ChannelTopicChangedNotice"
        - $ref: "#/components/schemas/MemberJoinedNotice"
        - $ref: "#/components/schemas/ServerRenamedNotice"
        - $ref: "#/components/schemas/RegistrationModeChangedNotice"
      discriminator:
        propertyName: type
        mapping:
          channel_created: "#/components/schemas/ChannelCreatedNotice"
          channel_renamed: "#/components/schemas/ChannelRenamedNotice"
          channel_topic_changed: "#/components/schemas/ChannelTopicChangedNotice"
          member_joined: "#/components/schemas/MemberJoinedNotice"
          server_renamed: "#/components/schemas/ServerRenamedNotice"
          registration_mode_changed: "#/components/schemas/RegistrationModeChangedNotice"

    ChannelCreatedNotice:
      type: object
      description: The channel was created by the author
      required: [type]
      properties:
        type:
          type: string

    ChannelRenamedNotice:
      type: object
      description: The author renamed the channel
      required: [type, from, to]
      properties:
        type:
          type: string
        from:
          type: string
        to:
          type: string

    ChannelTopicChangedNotice:
      type: object
      description: The author set, changed or cleared the channel's topic
      required: [type]
      properties:
        type:
          type: string
        from:
          type: string
          nullable: true
          description: Null when there was no topic
        to:
          type: string
          nullable: true
          description: Null when the topic was cleared

    MemberJoinedNotice:
      type: object
      description: The author registered on the server
      required: [type]
      properties:
        type:
          type: string

    ServerRenamedNotice:
      type: object
      description: The author renamed the community
      required: [type, from, to]
      properties:
        type:
          type: string
        from:
          type: string
        to:
          type: string

    RegistrationModeChangedNotice:
      type: object
      description: The author changed who may register
      required: [type, from, to]
      properties:
        type:
          type: string
        from:
          $ref: "#/components/schemas/RegistrationMode"
        to:
          $ref: "#/components/schemas/RegistrationMode"

    MessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '^\s*\S[\s\S]*$'
          description: See `Message.content`. Surrounding whitespace is removed.
        replyToId:
          $ref: "#/components/schemas/MessageId"
        nonce:
          type: string
          maxLength: 64
          description: |
            Chosen by the client and returned with the message, so a client can
            match its pending message to the stored one.

    MessageUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '^\s*\S[\s\S]*$'

    ReadState:
      type: object
      description: |
        How far the member has read a channel: messages after
        `lastReadMessageId` are unread. The first time a member can see a
        channel, everything in it so far counts as read.
      required: [channelId]
      properties:
        channelId:
          $ref: "#/components/schemas/ChannelId"
        lastReadMessageId:
          allOf:
            - $ref: "#/components/schemas/MessageId"
          nullable: true
          description: |
            The newest message read. Null when the channel was empty as the
            member first saw it and nothing has been read since, so every
            message in it is unread. The message may have been deleted.
        lastMessageId:
          allOf:
            - $ref: "#/components/schemas/MessageId"
          nullable: true
          description: |
            The channel's newest message when this was sent, null if it has
            none; later ones arrive as `message_created`. The channel has
            unread messages while this is after `lastReadMessageId`.

    ReadStateUpdate:
      type: object
      required: [lastReadMessageId]
      properties:
        lastReadMessageId:
          $ref: "#/components/schemas/MessageId"

    Permission:
      type: string
      description: |
        Roles grant permissions server-wide; they apply the same in every
        channel the member can see. Which channels those are is decided by
        the channels' required roles, not by a permission.
      enum:
        - MANAGE_SERVER
        - MANAGE_ROLES
        - MANAGE_CHANNELS
        - MANAGE_INVITES
        - TIMEOUT_MEMBERS
        - BAN_MEMBERS
        - CREATE_INVITE
        - SEND_MESSAGES
        - MANAGE_MESSAGES
        - CONNECT
        - SPEAK
        - STREAM
        - MUTE_MEMBERS
        - MOVE_MEMBERS

    PermissionSet:
      type: object
      required: [owner, permissions]
      properties:
        owner:
          type: boolean
          description: True for the server owner, who holds every permission
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    ChannelType:
      type: string
      enum: [text, voice, voice_text]
      description: |
        `text`: messages only. `voice`: voice only, without messages.
        `voice_text`: voice with its own messages alongside.

    Channel:
      type: object
      required: [id, type, name, position, requiredRoleIds, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ChannelId"
        type:
          $ref: "#/components/schemas/ChannelType"
        name:
          type: string
          example: general
        topic:
          type: string
          nullable: true
        position:
          type: integer
          description: 0 is the top; positions are contiguous across all channels
        bitrate:
          type: integer
          nullable: true
          description: Audio bitrate in bits per second; voice channels only
          example: 64000
        userLimit:
          type: integer
          nullable: true
          description: Most members connected at once, 0 for no limit; voice channels only
        requiredRoleIds:
          type: array
          items:
            $ref: "#/components/schemas/RoleId"
          description: |
            Empty for a public channel. Otherwise only members holding at
            least one of these roles, and the owner, see the channel.
        createdAt:
          type: string
          format: date-time

    ChannelCreate:
      type: object
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/ChannelType"
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^\s*\S.*$'
          description: Surrounding whitespace is removed
        topic:
          type: string
          maxLength: 1024
        bitrate:
          type: integer
          minimum: 8000
          maximum: 510000
          description: Voice channels only; defaults to `ServerInfo.voice.defaultBitrate`
        userLimit:
          type: integer
          minimum: 0
          maximum: 99
          description: Voice channels only; defaults to 0, no limit
        requiredRoleIds:
          type: array
          items:
            $ref: "#/components/schemas/RoleId"
          description: Makes the channel private to these roles; defaults to none, a public channel

    ChannelUpdate:
      type: object
      description: Partial update; absent fields stay unchanged
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^\s*\S.*$'
        topic:
          type: string
          maxLength: 1024
          description: Empty string clears the topic
        bitrate:
          type: integer
          minimum: 8000
          maximum: 510000
        userLimit:
          type: integer
          minimum: 0
          maximum: 99
        position:
          type: integer
          minimum: 0
          description: New place in the list; values past the end move it last
        requiredRoleIds:
          type: array
          items:
            $ref: "#/components/schemas/RoleId"
          description: Replaces the whole set; empty makes the channel public

    Role:
      type: object
      required: [id, name, position, permissions, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/RoleId"
        name:
          type: string
          example: Moderator
        color:
          type: string
          nullable: true
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#5865F2"
        position:
          type: integer
          description: Display order, highest first
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time

    RoleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: Defaults to none

    RoleUpdate:
      type: object
      description: Partial update; absent fields stay unchanged
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^$|^#[0-9A-Fa-f]{6}$"
          description: Empty string clears the colour
        position:
          type: integer
          minimum: 0
          description: Roles at or above this position move up one
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: Replaces the whole set

    Ban:
      type: object
      required: [accountId, createdAt]
      properties:
        accountId:
          $ref: "#/components/schemas/AccountId"
        reason:
          type: string
          nullable: true
          description: Shown to the member when they try to log in
        bannedBy:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: Who banned them; null if that account is gone
        createdAt:
          type: string
          format: date-time

    BanCreate:
      type: object
      properties:
        reason:
          type: string
          maxLength: 512
          description: Optional; surrounding whitespace is removed, blank means none

    TimeoutCreate:
      type: object
      required: [durationSeconds]
      properties:
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 2419200
          description: How long from now, at most 28 days

    BanNotice:
      type: object
      description: Why a member cannot log in
      required: [bannedAt]
      properties:
        reason:
          type: string
          nullable: true
        bannedAt:
          type: string
          format: date-time

    InviteCode:
      type: string
      pattern: "^[A-Za-z0-9]{8}$"
      description: Identifies an invite; the last path segment of an invite link
      example: k3Jd8QzP

    Binary:
      type: string
      format: binary

    InviteCreate:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 31536000
          description: Lifetime from now; omit for an invite that never expires
        maxUses:
          type: integer
          minimum: 1
          maximum: 1000000
          description: How many registrations may use it; omit for unlimited

    Invite:
      type: object
      required: [code, url, createdBy, createdAt, uses, revoked]
      properties:
        code:
          $ref: "#/components/schemas/InviteCode"
        url:
          type: string
          description: Full link, built from `ServerSettings.publicUrl` when set
          example: https://chat.example.com/invite/k3Jd8QzP
        createdBy:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: Null if the creator's account was deleted
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        uses:
          type: integer
        revoked:
          type: boolean

    InvitePreview:
      type: object
      required: [code, community]
      properties:
        code:
          $ref: "#/components/schemas/InviteCode"
        community:
          $ref: "#/components/schemas/Community"
        inviter:
          allOf:
            - $ref: "#/components/schemas/Account"
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ServerInfo:
      type: object
      required: [name, version, protocol, community, registration, voice]
      properties:
        registration:
          $ref: "#/components/schemas/RegistrationInfo"
        voice:
          $ref: "#/components/schemas/VoiceInfo"
        name:
          type: string
          description: Software name, always `Snatter`
          example: Snatter
        version:
          type: string
          description: Software version
          example: 0.1.0
        protocol:
          $ref: "#/components/schemas/ProtocolInfo"
        community:
          $ref: "#/components/schemas/Community"
        ownerId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          nullable: true
          description: |
            The server owner, who holds every permission and cannot be
            moderated; null on a fresh server with no accounts yet

    ProtocolInfo:
      type: object
      description: Which protocol versions the server speaks and accepts; see Versions at the top
      required: [version, minClient]
      properties:
        version:
          allOf:
            - $ref: "#/components/schemas/ProtocolVersion"
          description: The protocol version the server speaks
        minClient:
          allOf:
            - $ref: "#/components/schemas/ProtocolVersion"
          description: |
            The oldest client protocol version the server accepts in
            `identify`: the first of its own major version, or later if the
            server's release raised it

    ProtocolVersion:
      type: string
      pattern: '^[0-9]+\.[0-9]+$'
      description: A protocol version, `major.minor`; compare the parts as numbers
      example: "1.0"

    RegistrationMode:
      type: string
      enum: [open, invite_only]
      description: |
        `open`: anyone may register. `invite_only`: registration needs an
        invite (the first account on a fresh server is always allowed).

    VoiceInfo:
      type: object
      required: [defaultBitrate]
      properties:
        defaultBitrate:
          type: integer
          minimum: 8000
          maximum: 510000
          description: Bitrate of new voice channels, in bits per second
          example: 64000

    RegistrationInfo:
      type: object
      required: [mode, challengeRequired, setupRequired]
      properties:
        mode:
          $ref: "#/components/schemas/RegistrationMode"
        challengeRequired:
          type: boolean
          description: Whether registration requires a solved challenge from `GET /api/v1/auth/challenge`
        setupRequired:
          type: boolean
          description: |
            A fresh server with no accounts yet. The next registration needs
            neither an invite nor a challenge, whatever `mode` and
            `challengeRequired` say, and its account becomes the server
            owner.

    RateLimitPolicy:
      type: object
      required: [limit, periodSeconds]
      description: A token bucket per client IP allowing `limit` requests per `periodSeconds`
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100000
        periodSeconds:
          type: integer
          minimum: 1
          maximum: 86400

    RateLimits:
      type: object
      description: |
        Token buckets: each allows `limit` requests at once, refilling at
        `limit` per `periodSeconds`. `message` is counted per account,
        the others per client IP address.
      required: [enabled, login, register, challenge, invite, message]
      properties:
        enabled:
          type: boolean
          description: Switches every limit on or off
        login:
          $ref: "#/components/schemas/RateLimitPolicy"
        register:
          $ref: "#/components/schemas/RateLimitPolicy"
        challenge:
          $ref: "#/components/schemas/RateLimitPolicy"
        invite:
          allOf:
            - $ref: "#/components/schemas/RateLimitPolicy"
          description: Applies to the public invite preview
        message:
          allOf:
            - $ref: "#/components/schemas/RateLimitPolicy"
          description: Messages sent by one member, in any channel

    ServerSettings:
      type: object
      required: [name, registrationMode, challengeRequired, challengeMaxNumber, rateLimits, sessionLifetimeDays, voice]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        publicUrl:
          type: string
          nullable: true
          maxLength: 255
          description: Address clients reach this server at, used to build invite links
          example: https://chat.example.com
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        challengeRequired:
          type: boolean
          description: Require a proof-of-work challenge on registration
        challengeMaxNumber:
          $ref: "#/components/schemas/ChallengeMaxNumber"
        rateLimits:
          $ref: "#/components/schemas/RateLimits"
        sessionLifetimeDays:
          $ref: "#/components/schemas/SessionLifetimeDays"
        voice:
          $ref: "#/components/schemas/VoiceInfo"
        systemChannelId:
          allOf:
            - $ref: "#/components/schemas/ChannelId"
          nullable: true
          description: |
            Channel that receives server-wide notices such as members joining
            or the registration mode changing; null for none. Deleting the
            channel turns them off.
        newMemberRoleId:
          allOf:
            - $ref: "#/components/schemas/RoleId"
          nullable: true
          description: |
            Role given to accounts when they register; null for none, so new
            members can only browse until someone gives them a role. The
            role cannot be deleted while it is set here.

    ServerSettingsUpdate:
      type: object
      description: Partial update; absent fields stay unchanged
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          description: Empty string clears the description
        publicUrl:
          type: string
          maxLength: 255
          pattern: "^$|^https?://[^/\\s]+(/[^\\s]*)?$"
          description: Empty string clears it; otherwise an http(s) URL, trailing slash ignored
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        challengeRequired:
          type: boolean
        challengeMaxNumber:
          $ref: "#/components/schemas/ChallengeMaxNumber"
        rateLimits:
          $ref: "#/components/schemas/RateLimits"
        sessionLifetimeDays:
          $ref: "#/components/schemas/SessionLifetimeDays"
        voice:
          $ref: "#/components/schemas/VoiceInfo"
        systemChannelId:
          type: string
          pattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: |
            Id of a text or voice-and-text channel for server-wide notices; an
            empty string turns them off. An unknown channel is rejected
            (`channel_not_found`), and so is a voice-only one
            (`voice_only_channel`).
        newMemberRoleId:
          type: string
          pattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: |
            Id of the role new members get; an empty string gives them none.
            An unknown role is rejected (`role_not_found`). Existing members
            keep their roles.

    ChallengeMaxNumber:
      type: integer
      minimum: 1000
      maximum: 10000000
      description: |
        Difficulty of the registration challenge: the `maxnumber` of the
        challenges the server issues. A client tries half of it on average.
      example: 100000

    SessionLifetimeDays:
      type: integer
      minimum: 1
      maximum: 365
      description: |
        How many days a session stays valid without being used. A change
        applies to each session from its next use.
      example: 30

    Challenge:
      type: object
      required: [algorithm, challenge, salt, signature, maxnumber]
      properties:
        algorithm:
          type: string
          enum: [SHA-256]
        challenge:
          type: string
          description: Hex SHA-256 of `salt + number`
        salt:
          type: string
          description: Random salt; contains `?expires=<unix seconds>`
        signature:
          type: string
          description: Server HMAC over `challenge`; opaque to clients
        maxnumber:
          type: integer
          description: Upper bound for `number`

    Community:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Snattra HQ
        description:
          type: string
          nullable: true
          maxLength: 1000

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_]+$"
          description: Letters A to Z, digits and underscores; unique on this server regardless of case
          example: robin
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          maxLength: 64
          description: |
            Letters of any script, digits, punctuation, symbols and plain
            spaces; blank means the username. Surrounding whitespace is
            removed and runs of spaces become one, and nothing else is
            changed. Anything else is refused with `invalid_display_name`:
            emoji (whatever is drawn as emoji by default, flags and skin
            tones included), control and format characters such as line
            breaks, bidirectional overrides and zero-width characters, other
            kinds of space, combining marks, and letters that draw nothing.
        altcha:
          type: string
          maxLength: 2048
          description: Solved challenge payload; required when `ServerInfo.registration.challengeRequired` is true
        inviteCode:
          allOf:
            - $ref: "#/components/schemas/InviteCode"
          description: Required when `ServerInfo.registration.mode` is `invite_only`; validated if given otherwise

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: robin
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [token, expiresAt, account]
      properties:
        token:
          type: string
          description: Bearer token for later requests
          example: snt_Zm9vYmFyYmF6cXV4...
        expiresAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"

    Account:
      type: object
      required: [id, username, displayName, roleIds, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        username:
          type: string
          example: robin
        displayName:
          type: string
          example: Robin
        avatarId:
          allOf:
            - $ref: "#/components/schemas/BlobId"
          nullable: true
          description: Profile picture, fetch at `/api/v1/blobs/{avatarId}`; null if none
        roleIds:
          type: array
          items:
            $ref: "#/components/schemas/RoleId"
          description: Assigned roles; without any the member can only browse
        timedOutUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            End of the member's timeout, during which they keep their roles
            but hold no permissions; null when not timed out
        bannedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the member was banned, which everyone may know; null when
            they are not. The reason is only for members holding
            `BAN_MEMBERS` (`listBans`).
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code
          example: username_taken
        message:
          type: string
          description: Human-readable explanation
        fields:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Per-field messages for `validation_failed`, null otherwise
        ban:
          allOf:
            - $ref: "#/components/schemas/BanNotice"
          nullable: true
          description: Why, for `banned`; null otherwise

    # --- Gateway ------------------------------------------------------------
    # Frames of the WebSocket at /api/v1/gateway; see the description at the top.

    GatewayCloseReason:
      type: string
      description: |
        Why the server closed a gateway connection. The WebSocket close code
        and the reason text (this name) are:

        | Code | Name                    | Client should                         |
        |------|-------------------------|---------------------------------------|
        | 4000 | `invalid_frame`         | fix the client; the frame was not understood |
        | 4001 | `not_identified`        | send `identify` first                 |
        | 4002 | `authentication_failed` | log in again; the token is not valid  |
        | 4003 | `already_identified`    | identify only once per connection     |
        | 4004 | `session_ended`         | log in again; the session was logged out or revoked |
        | 4005 | `banned`                | stop reconnecting; logging in says why |
        | 4006 | `client_outdated`       | stop reconnecting until the client is updated; the session stays valid |
        | 4500 | `identify_timeout`      | reconnect and identify sooner         |
        | 4501 | `too_slow`              | reconnect; the client fell too far behind |

        Codes from 4000 to 4499 mean a reconnect would be refused again, and
        codes from 4500 to 4999 mean reconnect, so a client knows what to do
        with a code added after it was built. A server shutting down closes
        with the standard 1001 (going away); reconnect after a moment.
      enum:
        - invalid_frame
        - not_identified
        - authentication_failed
        - already_identified
        - session_ended
        - banned
        - client_outdated
        - identify_timeout
        - too_slow

    GatewayClientFrame:
      description: A frame the client sends, told apart by `type`
      oneOf:
        - $ref: "#/components/schemas/GatewayIdentify"
        - $ref: "#/components/schemas/GatewayTyping"
      discriminator:
        propertyName: type
        mapping:
          identify: "#/components/schemas/GatewayIdentify"
          typing: "#/components/schemas/GatewayTyping"

    GatewayIdentify:
      type: object
      description: Authenticates the connection; must be the first frame, sent once
      required: [type, token, protocol]
      properties:
        type:
          type: string
        token:
          type: string
          description: A session token from login or registration
        protocol:
          allOf:
            - $ref: "#/components/schemas/ProtocolVersion"
          description: |
            The protocol version the client speaks. Older than the server's
            `protocol.minClient`, the connection is closed with
            `client_outdated`.

    GatewayTyping:
      type: object
      description: |
        The member is typing in a channel. Send it when they start and again
        every 8 seconds while they keep typing; stop when they send or clear
        the message. The server passes it on as `typing_started` at most once
        per channel every 5 seconds per connection and drops the rest, and
        silently drops it for a channel the member cannot see or send
        messages to.
      required: [type, channelId]
      properties:
        type:
          type: string
        channelId:
          $ref: "#/components/schemas/ChannelId"

    PresenceStatus:
      type: string
      enum: [online, offline]
      description: |
        `online` while the member has at least one identified gateway
        connection, `offline` otherwise.

    Presence:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          $ref: "#/components/schemas/AccountId"
        status:
          $ref: "#/components/schemas/PresenceStatus"

    GatewayServerFrame:
      description: A frame the server sends, told apart by `type`
      oneOf:
        - $ref: "#/components/schemas/GatewayReady"
        - $ref: "#/components/schemas/GatewayServerUpdated"
        - $ref: "#/components/schemas/GatewayPermissionsChanged"
        - $ref: "#/components/schemas/GatewayMemberJoined"
        - $ref: "#/components/schemas/GatewayMemberUpdated"
        - $ref: "#/components/schemas/GatewayRoleCreated"
        - $ref: "#/components/schemas/GatewayRoleUpdated"
        - $ref: "#/components/schemas/GatewayRoleDeleted"
        - $ref: "#/components/schemas/GatewayChannelCreated"
        - $ref: "#/components/schemas/GatewayChannelUpdated"
        - $ref: "#/components/schemas/GatewayChannelDeleted"
        - $ref: "#/components/schemas/GatewayMessageCreated"
        - $ref: "#/components/schemas/GatewayMessageUpdated"
        - $ref: "#/components/schemas/GatewayMessageDeleted"
        - $ref: "#/components/schemas/GatewayMessagesPurged"
        - $ref: "#/components/schemas/GatewayPresenceUpdated"
        - $ref: "#/components/schemas/GatewayTypingStarted"
        - $ref: "#/components/schemas/GatewayReadStateUpdated"
      discriminator:
        propertyName: type
        mapping:
          ready: "#/components/schemas/GatewayReady"
          server_updated: "#/components/schemas/GatewayServerUpdated"
          permissions_changed: "#/components/schemas/GatewayPermissionsChanged"
          member_joined: "#/components/schemas/GatewayMemberJoined"
          member_updated: "#/components/schemas/GatewayMemberUpdated"
          role_created: "#/components/schemas/GatewayRoleCreated"
          role_updated: "#/components/schemas/GatewayRoleUpdated"
          role_deleted: "#/components/schemas/GatewayRoleDeleted"
          channel_created: "#/components/schemas/GatewayChannelCreated"
          channel_updated: "#/components/schemas/GatewayChannelUpdated"
          channel_deleted: "#/components/schemas/GatewayChannelDeleted"
          message_created: "#/components/schemas/GatewayMessageCreated"
          message_updated: "#/components/schemas/GatewayMessageUpdated"
          message_deleted: "#/components/schemas/GatewayMessageDeleted"
          messages_purged: "#/components/schemas/GatewayMessagesPurged"
          presence_updated: "#/components/schemas/GatewayPresenceUpdated"
          typing_started: "#/components/schemas/GatewayTypingStarted"
          read_state_updated: "#/components/schemas/GatewayReadStateUpdated"

    GatewayServerFrameBase:
      type: object
      description: What every server frame has
      required: [type, seq]
      properties:
        type:
          type: string
        seq:
          type: integer
          format: int64
          description: Position of the frame on this connection, 1 for `ready`

    GatewayReady:
      description: Everything a client needs to start, sent once after `identify`
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [account, permissions, server, roles, members, presences, channels, readStates]
          properties:
            account:
              $ref: "#/components/schemas/Account"
            permissions:
              $ref: "#/components/schemas/PermissionSet"
            server:
              $ref: "#/components/schemas/ServerInfo"
            roles:
              type: array
              items:
                $ref: "#/components/schemas/Role"
              description: Highest position first
            members:
              type: array
              items:
                $ref: "#/components/schemas/Account"
            presences:
              type: array
              items:
                $ref: "#/components/schemas/Presence"
              description: Members who are not offline, including the caller
            channels:
              type: array
              items:
                $ref: "#/components/schemas/Channel"
              description: The channels the member can see, top first
            readStates:
              type: array
              items:
                $ref: "#/components/schemas/ReadState"
              description: One for each of those channels that keeps messages

    GatewayServerUpdated:
      description: The public server description changed
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [server]
          properties:
            server:
              $ref: "#/components/schemas/ServerInfo"

    GatewayPermissionsChanged:
      description: The member's server-level permissions changed
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [permissions]
          properties:
            permissions:
              $ref: "#/components/schemas/PermissionSet"

    GatewayMemberJoined:
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [member]
          properties:
            member:
              $ref: "#/components/schemas/Account"

    GatewayMemberUpdated:
      description: A member's profile, roles, timeout or ban changed
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [member]
          properties:
            member:
              $ref: "#/components/schemas/Account"

    GatewayRoleCreated:
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [role]
          properties:
            role:
              $ref: "#/components/schemas/Role"

    GatewayRoleUpdated:
      description: A role changed, including its position when others moved
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [role]
          properties:
            role:
              $ref: "#/components/schemas/Role"

    GatewayRoleDeleted:
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [roleId]
          properties:
            roleId:
              $ref: "#/components/schemas/RoleId"

    GatewayChannelCreated:
      description: A channel was created, or became visible to the member
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [channel]
          properties:
            channel:
              $ref: "#/components/schemas/Channel"

    GatewayChannelUpdated:
      description: A channel changed, including its position when others moved
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [channel]
          properties:
            channel:
              $ref: "#/components/schemas/Channel"

    GatewayChannelDeleted:
      description: A channel was deleted, or is no longer visible to the member
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [channelId]
          properties:
            channelId:
              $ref: "#/components/schemas/ChannelId"

    GatewayMessageCreated:
      description: |
        A message was sent or a notice written. The `nonce` of a user
        message is set only on connections of the session that sent it.
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [message]
          properties:
            message:
              $ref: "#/components/schemas/Message"

    GatewayMessageUpdated:
      description: |
        A message changed: edited, or deleted and now a `DeletedMessage`.
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [message]
          properties:
            message:
              $ref: "#/components/schemas/Message"

    GatewayMessageDeleted:
      description: A system notice was removed; it is gone from the channel.
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [channelId, messageId]
          properties:
            channelId:
              $ref: "#/components/schemas/ChannelId"
            messageId:
              $ref: "#/components/schemas/MessageId"

    GatewayMessagesPurged:
      description: |
        A member's messages in a channel were deleted at once, all of them
        from `fromMessageId` to `toMessageId`. Each user message by
        `authorId` in that range is now a `DeletedMessage` with these
        `deletedAt` and `removedByModerator`.
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [channelId, authorId, fromMessageId, toMessageId, deletedAt, removedByModerator]
          properties:
            channelId:
              $ref: "#/components/schemas/ChannelId"
            authorId:
              $ref: "#/components/schemas/AccountId"
            fromMessageId:
              $ref: "#/components/schemas/MessageId"
            toMessageId:
              $ref: "#/components/schemas/MessageId"
            deletedAt:
              type: string
              format: date-time
            removedByModerator:
              type: boolean

    GatewayPresenceUpdated:
      description: A member came online or went offline
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [presence]
          properties:
            presence:
              $ref: "#/components/schemas/Presence"

    GatewayTypingStarted:
      description: |
        Another member is typing in a channel. Show it until 10 seconds pass
        without another `typing_started` from them there, or until a message
        from them arrives in the channel. Never sent for the caller's own
        typing, from any of their connections.
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [channelId, accountId]
          properties:
            channelId:
              $ref: "#/components/schemas/ChannelId"
            accountId:
              $ref: "#/components/schemas/AccountId"

    GatewayReadStateUpdated:
      description: |
        The member's read marker in a channel moved, from any of their
        sessions or by sending a message there. Also sent right after
        `channel_created` for a channel with messages that became visible,
        saying where reading starts in it.
      allOf:
        - $ref: "#/components/schemas/GatewayServerFrameBase"
        - type: object
          required: [readState]
          properties:
            readState:
              $ref: "#/components/schemas/ReadState"
